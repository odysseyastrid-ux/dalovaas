name: Deploy nyøkøn to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/message-send-new-skills-2m962r
    paths:
      - "apps/nyokon/**"
      - ".github/workflows/deploy-nyokon-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload nyøkøn as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/nyokon
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
