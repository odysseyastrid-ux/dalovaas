<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Google Ads images — Magicstick Clean</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Baskerville:wght@700&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Each .ad is rendered on its own at its exact pixel size (scripts in the scratchpad). */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --navy: #14143a; --grad: linear-gradient(100deg, #2f7ff0 0%, #5b5cf0 50%, #8a3ff0 100%); }
  body { font-family: Inter, sans-serif; background: #ddd; display: flex; flex-wrap: wrap; gap: 30px; padding: 30px; }
  .ad { position: relative; overflow: hidden; background: #fff; flex: none; }
  .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mark { display: block; }

  /* ---------- Performance Max / Demand Gen photos: real before/after, very little text ---------- */
  .ba { display: grid; grid-template-columns: 1fr 1fr; width: 100%; height: 100%; gap: 6px; background: #fff; }
  .ba figure { position: relative; overflow: hidden; }
  .ba img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ba figcaption { position: absolute; top: 4%; left: 4%; background: rgba(20,20,58,.85); color: #fff; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; }
  .pill-logo { position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%); background: #fff; border-radius: 999px; display: flex; align-items: center; gap: .5em; box-shadow: 0 6px 22px rgba(0,0,0,.18); white-space: nowrap; }
  .pill-logo b { font-family: "Libre Baskerville", serif; color: var(--navy); }
  .pill-logo i { font-style: normal; font-weight: 900; }

  /* ---------- Logos ---------- */
  .logo-row { display: flex; align-items: center; justify-content: center; height: 100%; gap: 28px; }
  .logo-row .m { font-family: "Libre Baskerville", serif; font-weight: 700; color: var(--navy); line-height: .95; }
  .logo-row .c { font-weight: 900; letter-spacing: -0.03em; line-height: .9; }

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2f7ff0"/><stop offset="1" stop-color="#8a3ff0"/></linearGradient>
    <symbol id="mark" viewBox="0 0 130 110">
      <path d="M14 62 L44 92 L104 26" fill="none" stroke="url(#g)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M108 2 L112.5 15.5 L126 20 L112.5 24.5 L108 38 L103.5 24.5 L90 20 L103.5 15.5 Z" fill="#8a3ff0"/>
    </symbol>
  </defs>
</svg>

<!-- Performance Max / Demand Gen: landscape 1.91:1 -->
<div class="ad" id="pmax-landscape-1200x628" style="width:1200px;height:628px">
  <div class="ba">
    <figure><img src="../assets/images/before-fridge.jpg" alt=""><figcaption style="font-size:22px;padding:6px 16px">Avant</figcaption></figure>
    <figure><img src="../assets/images/after-fridge.jpg" alt=""><figcaption style="font-size:22px;padding:6px 16px">Après</figcaption></figure>
  </div>
  <div class="pill-logo" style="font-size:28px;padding:12px 26px"><svg class="mark" width="44" height="37"><use href="#mark"/></svg><span><b>Magicstick</b> <i class="g">Clean</i></span></div>
</div>

<!-- square 1:1 -->
<div class="ad" id="pmax-square-1200x1200" style="width:1200px;height:1200px">
  <div class="ba">
    <figure><img src="../assets/images/before-bathroom.jpg" alt=""><figcaption style="font-size:30px;padding:8px 20px">Avant</figcaption></figure>
    <figure><img src="../assets/images/after-bathroom.jpg" alt=""><figcaption style="font-size:30px;padding:8px 20px">Après</figcaption></figure>
  </div>
  <div class="pill-logo" style="font-size:38px;padding:16px 34px"><svg class="mark" width="60" height="51"><use href="#mark"/></svg><span><b>Magicstick</b> <i class="g">Clean</i></span></div>
</div>

<!-- portrait 4:5 -->
<div class="ad" id="pmax-portrait-960x1200" style="width:960px;height:1200px">
  <div class="ba">
    <figure><img src="../assets/images/before-hardwood-floor.jpg" alt=""><figcaption style="font-size:26px;padding:7px 18px">Avant</figcaption></figure>
    <figure><img src="../assets/images/after-hardwood-floor.jpg" alt=""><figcaption style="font-size:26px;padding:7px 18px">Après</figcaption></figure>
  </div>
  <div class="pill-logo" style="font-size:32px;padding:14px 28px"><svg class="mark" width="50" height="42"><use href="#mark"/></svg><span><b>Magicstick</b> <i class="g">Clean</i></span></div>
</div>

<!-- logos -->
<div class="ad" id="logo-square-1200x1200" style="width:1200px;height:1200px">
  <svg class="mark" width="1200" height="1200" viewBox="-20 -25 170 160"><use href="#mark"/></svg>
</div>
<div class="ad" id="logo-landscape-1200x300" style="width:1200px;height:300px">
  <div class="logo-row"><svg class="mark" width="210" height="178"><use href="#mark"/></svg><div><div class="m" style="font-size:78px">MAGICSTICK</div><div class="c g" style="font-size:118px">Clean</div></div></div>
</div>

</body>
</html>
