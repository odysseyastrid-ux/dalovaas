<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login | Magicstick Clean Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--teal:#0B5D52;--charcoal:#1F2937;--gold:#C9A227;--cream:#F7F5F0;--gray:#6B7280;--line:#DDD8CC;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Work Sans',Arial,sans-serif;background:var(--cream);color:var(--charcoal);}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:36px;width:100%;max-width:380px;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Libre Baskerville',serif;font-weight:700;font-size:18px;margin-bottom:24px;}
  .badge{width:28px;height:28px;border-radius:100%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;}
  h1{font-size:22px;margin:0 0 20px;}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;margin-bottom:16px;}
  input:focus{outline:none;border-color:var(--teal);}
  button{width:100%;padding:12px;border:none;border-radius:6px;background:var(--gold);color:var(--charcoal);font-weight:700;font-size:15px;cursor:pointer;}
  button:hover{background:#B7911F;}
  .note{margin-top:14px;font-size:13.5px;text-align:center;min-height:1.2em;}
  .note.error{color:#B3261E;}
  .note.success{color:var(--teal);}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="badge">✓</span> Magicstick Clean</div>
    <h1>Staff login</h1>
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" required>
      <button type="submit">Log in</button>
      <p class="note" id="note"></p>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const note = document.getElementById('note');
      note.textContent = 'Signing in…';
      note.className = 'note';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          note.textContent = data.error || 'Login failed.';
          note.className = 'note error';
          return;
        }
        localStorage.setItem('magicstick_admin_token', data.token);
        note.textContent = 'Signed in — redirecting…';
        note.className = 'note success';
        window.location.href = '/dashboard.html';
      } catch (err) {
        note.textContent = 'Could not reach the server.';
        note.className = 'note error';
      }
    });
  </script>
</body>
</html>
