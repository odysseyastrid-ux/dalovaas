<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>nyøkøn — Collection</title>
<meta name="description" content="nyøkøn — custom streetwear, drops and made-to-order pieces." />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/DrawSVGPlugin.min.js"></script>
</head>
<body>

<div class="starfield" aria-hidden="true">
  <div class="starfield-base"></div>
  <div class="stars-layer" id="stars"></div>
  <div class="stars-layer" id="stars2"></div>
  <div class="stars-layer" id="stars3"></div>
</div>

<div class="announce" data-i18n="announce"></div>

<header class="site-header" id="siteHeader">
  <div class="nav-dropdown" id="categoriesDropdown">
    <button class="nav-trigger" id="categoriesBtn" aria-haspopup="true" aria-expanded="false">
      <span data-i18n="nav_categories"></span>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="dropdown-panel" id="categoriesPanel">
      <a href="#shop" data-filter="men" data-i18n="filter_men"></a>
      <a href="#shop" data-filter="women" data-i18n="filter_women"></a>
      <a href="#shop" data-filter="kids" data-i18n="filter_kids"></a>
      <a href="#shop" data-filter="shoes" data-i18n="filter_shoes"></a>
      <a href="#shop" data-filter="bags" data-i18n="filter_bags"></a>
      <a href="#shop" data-filter="accessories" data-i18n="filter_accessories"></a>
      <a href="#shop" data-filter="fragrance" data-i18n="filter_fragrance"></a>
      <a href="#shop" data-filter="all" class="dropdown-panel-all" data-i18n="nav_shop"></a>
    </div>
  </div>

  <a href="#top" class="wordmark" aria-label="nyøkøn">
    <svg class="wordmark-svg" viewBox="0 -2366 8702 3291" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
      <path class="wm-letter" d="M75 0V-300H220V-759H75V-1032L690 -1091V-955Q752 -1020 845.0 -1055.5Q938 -1091 1045 -1091Q1226 -1091 1310.5 -988.5Q1395 -886 1395 -680V-300H1535V0H915V-680Q915 -738 890.0 -764.5Q865 -791 824 -791Q790 -791 756.5 -771.0Q723 -751 700 -716V-300H790V0Z"/>

    </svg>
  </a>

  <div class="header-actions">
    <div class="nav-dropdown" id="settingsDropdown">
      <button class="icon-link" id="settingsBtn" data-i18n-aria="aria_settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/>
          <line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/>
          <line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <div class="dropdown-panel settings-panel" id="settingsPanel">
        <div class="settings-row">
          <span class="settings-label" data-i18n="settings_language"></span>
          <div class="lang-switch">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="fr">FR</button>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-label" data-i18n="settings_currency"></span>
          <div class="currency-select-wrap">
            <select class="currency-select" data-i18n-aria="aria_currency" aria-label="Currency">
              <option value="XOF">FCFA (XOF)</option>
              <option value="USD">USD ($)</option>
              <option value="EUR">EUR (€)</option>
              <option value="GBP">GBP (£)</option>
              <option value="CAD">CAD ($)</option>
              <option value="NGN">NGN (₦)</option>
              <option value="GHS">GHS (₵)</option>
              <option value="ZAR">ZAR (R)</option>
            </select>
          </div>
        </div>
        <div class="settings-row">
          <span class="settings-label" data-i18n="settings_theme"></span>
          <button class="icon-link theme-toggle" id="themeToggle" data-i18n-aria="aria_theme" aria-label="Toggle light/dark theme">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <a href="#" class="icon-link" data-i18n-aria="aria_search" aria-label="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </a>
    <a href="#" class="icon-link cart-link" data-i18n-aria="aria_cart" aria-label="Cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h2l2.4 12.2a2 2 0 0 0 2 1.8h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
      <span class="cart-count">0</span>
    </a>
  </div>
</header>

<main id="top">

  <!-- HERO -->
  <section class="hero">
    <div class="hero-media placeholder-img" data-placeholder="HERO IMAGE / VIDEO — 1920×1080+">
      <div class="hero-overlay"></div>
    </div>
    <div class="hero-content">
      <p class="hero-eyebrow" data-i18n="hero_eyebrow"></p>
      <h1 class="hero-title"><span data-i18n="hero_title_1"></span><br><span data-i18n="hero_title_2"></span></h1>
      <span class="gbtn-wrap">
        <span class="g-light"></span>
        <span class="g-layer" style="animation-delay:0s;animation-duration:20s;"></span>
        <span class="g-layer" style="animation-delay:.6s;animation-duration:15.9s;"></span>
        <span class="g-layer" style="animation-delay:1.3s;animation-duration:24.4s;"></span>
        <a href="#shop" class="btn btn-light" data-i18n="hero_cta"></a>
      </span>
    </div>
    <a href="#shop" class="scroll-cue" aria-label="Scroll down">
      <span></span>
    </a>
  </section>

  <!-- MARQUEE -->
  <div class="marquee">
    <div class="marquee-track">
      <span data-i18n="marquee_1"></span><span>•</span>
      <span data-i18n="marquee_2"></span><span>•</span>
      <span data-i18n="marquee_3"></span><span>•</span>
      <span>nyøkøn</span><span>•</span>
      <span data-i18n="marquee_1"></span><span>•</span>
      <span data-i18n="marquee_2"></span><span>•</span>
      <span data-i18n="marquee_3"></span><span>•</span>
      <span>nyøkøn</span><span>•</span>
    </div>
  </div>

  <!-- SHOP GRID -->
  <section class="shop" id="shop">
    <div class="section-head">
      <h2 data-i18n="shop_title"></h2>
      <input type="search" class="search-input" id="searchInput" data-i18n-placeholder="search_placeholder" data-i18n-aria="search_placeholder" placeholder="SEARCH" aria-label="Search products" />
    </div>
    <div class="filters" id="filters">
      <button class="filter active" data-filter="all" data-i18n="filter_all"></button>
      <button class="filter" data-filter="men" data-i18n="filter_men"></button>
      <button class="filter" data-filter="women" data-i18n="filter_women"></button>
      <button class="filter" data-filter="kids" data-i18n="filter_kids"></button>
      <button class="filter" data-filter="shoes" data-i18n="filter_shoes"></button>
      <button class="filter" data-filter="bags" data-i18n="filter_bags"></button>
      <button class="filter" data-filter="accessories" data-i18n="filter_accessories"></button>
      <button class="filter" data-filter="fragrance" data-i18n="filter_fragrance"></button>
    </div>

    <div class="product-grid" id="productGrid">
      <!-- Product cards are generated from PRODUCTS in script.js -->
    </div>
    <p class="no-results" id="noResults" data-i18n="no_results" hidden></p>
  </section>

  <!-- EDITORIAL SPLIT -->
  <section class="editorial" id="about">
    <div class="editorial-media">
      <iframe class="mask-3d" src="assets/mask-3d.html" title="nyøkøn — interactive 3D chrome mask, drag to rotate" loading="lazy"></iframe>
    </div>
    <div class="editorial-copy">
      <p class="editorial-eyebrow" data-i18n="editorial_eyebrow"></p>
      <h2 data-i18n="editorial_title"></h2>
      <p class="editorial-text" data-i18n="editorial_text"></p>
      <span class="gbtn-wrap">
        <span class="g-light"></span>
        <span class="g-layer" style="animation-delay:.15s;animation-duration:17.8s;"></span>
        <span class="g-layer" style="animation-delay:.9s;animation-duration:22.2s;"></span>
        <span class="g-layer" style="animation-delay:1.6s;animation-duration:19.2s;"></span>
        <a href="#" class="btn btn-outline" data-i18n="editorial_cta"></a>
      </span>
    </div>
  </section>

  <!-- LOOKBOOK STRIP -->
  <section class="lookbook" id="lookbook">
    <div class="section-head">
      <h2 data-i18n="lookbook_title"></h2>
    </div>
    <div class="lookbook-grid">
      <div class="placeholder-img lb-tall" data-placeholder="LOOKBOOK 01"></div>
      <div class="placeholder-img" data-placeholder="LOOKBOOK 02"></div>
      <div class="placeholder-img" data-placeholder="LOOKBOOK 03"></div>
      <div class="placeholder-img lb-tall" data-placeholder="LOOKBOOK 04"></div>
      <div class="placeholder-img" data-placeholder="LOOKBOOK 05"></div>
      <div class="placeholder-img" data-placeholder="LOOKBOOK 06"></div>
    </div>
  </section>

  <!-- NEWSLETTER -->
  <section class="newsletter" id="contact">
    <h2 data-i18n="newsletter_title"></h2>
    <p data-i18n="newsletter_text"></p>
    <form class="newsletter-form" id="newsletterForm">
      <input type="email" data-i18n-placeholder="newsletter_placeholder" placeholder="EMAIL ADDRESS" required data-i18n-aria="newsletter_placeholder" aria-label="Email address" />
      <span class="gbtn-wrap">
        <span class="g-light"></span>
        <span class="g-layer" style="animation-delay:.45s;animation-duration:17.8s;"></span>
        <span class="g-layer" style="animation-delay:1.1s;animation-duration:21.4s;"></span>
        <button type="submit" data-i18n="newsletter_btn"></button>
      </span>
    </form>
    <p class="newsletter-note" id="newsletterNote"></p>
  </section>

</main>

<footer class="site-footer">
  <div class="footer-top">
    <div class="footer-col">
      <a href="#top" class="wordmark small"><img src="assets/nyokon-wordmark.png" alt="nyøkøn" /></a>
      <p data-i18n="footer_tagline"></p>
    </div>
    <div class="footer-col">
      <h4 data-i18n="footer_shop_h"></h4>
      <a href="#shop" data-i18n="footer_shop_all"></a>
      <a href="#shop" data-i18n="footer_shop_new"></a>
      <a href="#shop" data-i18n="footer_shop_best"></a>
    </div>
    <div class="footer-col">
      <h4 data-i18n="footer_support_h"></h4>
      <a href="#" data-i18n="footer_shipping"></a>
      <a href="#" data-i18n="footer_returns"></a>
      <a href="#" data-i18n="footer_size"></a>
      <a href="#" data-i18n="footer_contact"></a>
    </div>
    <div class="footer-col">
      <h4 data-i18n="footer_follow_h"></h4>
      <a href="#">Instagram</a>
      <a href="#">TikTok</a>
    </div>
  </div>
  <div class="footer-bottom">
    <span>© <span id="year"></span> nyøkøn. <span data-i18n="footer_rights"></span></span>
    <span data-i18n="footer_note"></span>
  </div>
</footer>

<div class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer-head">
    <h3 data-i18n="cart_title"></h3>
    <button id="cartClose" data-i18n-aria="aria_cart_close" aria-label="Close cart">&times;</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total"><span data-i18n="cart_subtotal"></span><span id="cartTotal">$0</span></div>
    <span class="gbtn-wrap" style="width:100%;">
      <span class="g-light"></span>
      <span class="g-layer" style="animation-delay:0s;animation-duration:25s;"></span>
      <span class="g-layer" style="animation-delay:.53s;animation-duration:26.4s;"></span>
      <span class="g-layer" style="animation-delay:1.6s;animation-duration:29.2s;"></span>
      <button class="btn btn-light full" data-i18n="cart_checkout"></button>
    </span>
  </div>
</div>
<div class="cart-scrim" id="cartScrim"></div>

<script src="script.js"></script>
</body>
</html>
