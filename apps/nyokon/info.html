function showTopic(topic){
  if (!TOPICS.includes(topic)) topic = 'shipping';
  document.querySelectorAll('.info-tab').forEach(b => b.classList.toggle('is-active', b.dataset.topic === topic));
  document.querySelectorAll('.info-section').forEach(s => s.classList.toggle('is-active', s.dataset.topic === topic));
  document.getElementById('infoTitle').textContent = t(topic + '_title');
  history.replaceState(null, '', `info.html?topic=${topic}`);
}

function render(){
  const root = document.getElementById('infoRoot');
  root.innerHTML = `
    <h1 class="info-title" id="infoTitle"></h1>
    <div class="info-tabs">
      ${TOPICS.map(topic => `<button type="button" class="info-tab" data-topic="${topic}">${t('tab_' + topic)}</button>`).join('')}
    </div>
    ${sectionsHTML()}
  `;
  document.querySelectorAll('.info-tab').forEach(btn => {
    btn.addEventListener('click', () => showTopic(btn.dataset.topic));
  });
  const params = new URLSearchParams(location.search);
  showTopic(params.get('topic'));
  loadContact();
}

// Contact info comes from the same public `settings` table staff.html
// edits under Paiement → Informations de l'entreprise (also used on
// printed invoices), so it only needs to be set in one place.
async function loadContact(){
  const card = document.getElementById('contactCard');
  if (!sb) { card.innerHTML = `<p class="info-empty">${t('contact_empty')}</p>`; return; }
  try {
    const { data } = await sb.from('settings').select('key,value').in('key', ['biz_address', 'biz_phone', 'biz_email']);
    const byKey = {};
    (data || []).forEach(r => { byKey[r.key] = r.value; });
    const phone = byKey.biz_phone, email = byKey.biz_email, address = byKey.biz_address;
    if (!phone && !email && !address) { card.innerHTML = `<p class="info-empty">${t('contact_empty')}</p>`; return; }
    const waDigits = (phone || '').replace(/[^0-9]/g, '');
    card.innerHTML = `
      ${phone ? `
        <div class="info-contact-row">
          <span class="info-contact-label">${t('contact_phone')}</span>
          <span class="info-contact-value">
            <a href="tel:${phone.replace(/\s/g, '')}">${phone}</a>
            ${waDigits ? ` · <a href="https://wa.me/${waDigits}" target="_blank" rel="noopener">${t('contact_whatsapp_btn')}</a>` : ''}
          </span>
        </div>
      ` : ''}
      ${email ? `<div class="info-contact-row"><span class="info-contact-label">${t('contact_email')}</span><span class="info-contact-value"><a href="mailto:${email}">${email}</a></span></div>` : ''}
      ${address ? `<div class="info-contact-row"><span class="info-contact-label">${t('contact_address')}</span><span class="info-contact-value">${address}</span></div>` : ''}
    `;
  } catch (e) {
    card.innerHTML = `<p class="info-empty">${t('contact_empty')}</p>`;
  }
}

render();
