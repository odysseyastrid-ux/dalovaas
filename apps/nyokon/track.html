<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>nyøkøn</title>
<meta name="description" content="nyøkøn — track your order." />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  /* Printable invoice sheet — hidden on screen, revealed only inside
     @media print (everything else hidden), so "PDF" is just the
     browser's own print dialog ("Save as PDF") — no library needed. */
  #printSheet{display:none;}
  .print-header{display:flex;align-items:center;gap:16px;border-bottom:3px solid #0b0b0c;padding-bottom:16px;margin-bottom:24px;}
  .print-logo{height:40px;width:auto;}
  .print-biz-name{font-family:'Archivo Black',sans-serif;font-size:20px;}
  .print-biz-meta{font-size:12px;color:#555;margin-top:2px;line-height:1.5;}
  .print-doc-title{font-size:22px;font-weight:800;margin:18px 0 2px;}
  .print-doc-sub{font-size:12.5px;color:#555;margin-bottom:22px;}
  .print-kpi-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:22px;}
  .print-kpi{border:1px solid #ddd;border-radius:10px;padding:12px 18px;}
  .print-kpi-label{font-size:11px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.04em;}
  .print-kpi-value{font-size:14px;font-weight:800;margin-top:3px;}
  .print-table{width:100%;border-collapse:collapse;margin-bottom:22px;font-size:13px;}
  .print-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#666;border-bottom:2px solid #0b0b0c;padding:6px 8px;}
  .print-table td{padding:8px;border-bottom:1px solid #ddd;}
  .print-table td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .print-total-row td{font-weight:800;border-top:2px solid #0b0b0c;border-bottom:none;}
  .print-footer{margin-top:30px;font-size:11px;color:#888;}
  @media print{
    html,body{background:#fff!important;}
    body > *:not(#printSheet){display:none!important;}
    #printSheet{display:block!important;color:#0b0b0c;background:#fff;padding:0;font-family:Arial,Helvetica,sans-serif;}
    @page{margin:16mm;}
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="pdp-back" id="trackBack">BACK</a>
  <a href="index.html" class="wordmark"><img src="assets/nyokon-wordmark.png" alt="nyøkøn" /></a>
  <span></span>
</header>

<main class="track" id="trackRoot"></main>

<div id="printSheet">
  <div class="print-header">
    <img src="assets/nyokon-wordmark.png" alt="" class="print-logo" id="printLogo" />
    <div>
      <div class="print-biz-name" id="printBizName">nyøkøn</div>
      <div class="print-biz-meta" id="printBizMeta"></div>
    </div>
  </div>
  <div id="printBody"></div>
  <div class="print-footer" id="printFooter"></div>
</div>

<script>
const SUPABASE_URL = 'https://ejbuwatgnvxsfmwewyfu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_A49q39M9BU_QkJGPR8fc-g_d4FAIMKW';
const sb = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const DEFAULT_LANG = navigator.language && navigator.language.toLowerCase().startsWith('fr') ? 'fr' : 'en';
function loadLang(){
  try { const s = localStorage.getItem('nyokon-lang'); if (s === 'en' || s === 'fr') return s; } catch (e) {}
  return DEFAULT_LANG;
}
const currentLang = loadLang();
document.documentElement.lang = currentLang;

const T = {
  en: {
    back:'BACK', title:'TRACK YOUR ORDER',
    intro:'Enter the order reference from your confirmation to see its status.',
    ref_label:'ORDER REFERENCE', ref_placeholder:'e.g. NYK-1A2B3C', track_btn:'TRACK ORDER',
    not_found:"We couldn't find an order with that reference. Check it and try again.",
    order_ref:'Order', placed_on:'Placed on', items_label:'ITEMS', subtotal_label:'SUBTOTAL',
    fulfillment_label:'FULFILLMENT', pickup:'Pickup', delivery:'Delivery',
    city_label:'City', check_another:'Track another order',
    step_pending:'Received', step_confirmed:'Confirmed', step_shipped:'Out for delivery', step_delivered:'Delivered',
    status_cancelled:'This order was cancelled — contact us if you have questions.',
    live_note:'This page updates automatically — no need to refresh.',
    print_invoice:'Print invoice', invoice_title:'Invoice — Order No.', invoice_placed:'Placed on', invoice_status:'Status',
    invoice_customer:'Customer', invoice_phone:'Phone', invoice_fulfillment:'Fulfillment', invoice_address:'Address',
    invoice_item:'Item', invoice_qty:'Qty', invoice_unit_price:'Unit price', invoice_total:'Total',
    invoice_footer:'Invoice generated on', invoice_thanks:'thank you for your order.',
  },
  fr: {
    back:'RETOUR', title:'SUIVRE MA COMMANDE',
    intro:'Entre le numéro de commande reçu à la confirmation pour voir son statut.',
    ref_label:'NUMÉRO DE COMMANDE', ref_placeholder:'ex: NYK-1A2B3C', track_btn:'SUIVRE',
    not_found:"Aucune commande trouvée avec ce numéro. Vérifie-le et réessaie.",
    order_ref:'Commande', placed_on:'Passée le', items_label:'ARTICLES', subtotal_label:'SOUS-TOTAL',
    fulfillment_label:'RÉCUPÉRATION', pickup:'Retrait', delivery:'Livraison',
    city_label:'Ville', check_another:'Suivre une autre commande',
    step_pending:'Reçue', step_confirmed:'Confirmée', step_shipped:'En livraison', step_delivered:'Livrée',
    status_cancelled:'Cette commande a été annulée — contacte-nous si tu as des questions.',
    live_note:'Cette page se met à jour automatiquement — pas besoin de rafraîchir.',
    print_invoice:'Imprimer la facture', invoice_title:'Facture — Commande N°', invoice_placed:'Passée le', invoice_status:'Statut',
    invoice_customer:'Client', invoice_phone:'Téléphone', invoice_fulfillment:'Récupération', invoice_address:'Adresse',
    invoice_item:'Article', invoice_qty:'Qté', invoice_unit_price:'Prix unitaire', invoice_total:'Total',
    invoice_footer:'Facture générée le', invoice_thanks:'merci de ta confiance.',
  },
};
function t(key){ return T[currentLang][key] || T.en[key] || key; }
document.getElementById('trackBack').textContent = t('back');

(function applyStoredTheme(){
  try {
    if (localStorage.getItem('nyokon-theme') === 'light') document.documentElement.dataset.theme = 'light';
  } catch (e) {}
})();

const STEPS = ['pending', 'confirmed', 'shipped', 'delivered'];
let pollTimer = null;

function money(amount, currency){
  try { return new Intl.NumberFormat(currentLang === 'fr' ? 'fr-FR' : 'en-US', { style:'currency', currency, maximumFractionDigits:0 }).format(amount); }
  catch (e) { return `${amount} ${currency}`; }
}

function renderForm(errorMsg){
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  const root = document.getElementById('trackRoot');
  root.innerHTML = `
    <div class="track-form">
      <h1 class="track-title">${t('title')}</h1>
      <p class="track-intro">${t('intro')}</p>
      <form id="trackForm">
        <label class="track-label" for="trackRefInput">${t('ref_label')}</label>
        <input type="text" id="trackRefInput" placeholder="${t('ref_placeholder')}" autocomplete="off" />
        ${errorMsg ? `<p class="track-error">${errorMsg}</p>` : ''}
        <span class="gbtn-wrap gbtn-bar" style="margin-top:16px;">
          <span class="g-light"></span>
          <span class="g-layer" style="animation-delay:0s;animation-duration:25s;"></span>
          <span class="g-layer" style="animation-delay:.53s;animation-duration:26.4s;"></span>
          <span class="g-layer" style="animation-delay:1.6s;animation-duration:29.2s;"></span>
          <button type="submit" class="btn btn-light full">${t('track_btn')}</button>
        </span>
      </form>
    </div>
  `;
  const params = new URLSearchParams(location.search);
  const prefill = params.get('ref');
  if (prefill) document.getElementById('trackRefInput').value = prefill;
  document.getElementById('trackForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const ref = document.getElementById('trackRefInput').value.trim();
    if (!ref) return;
    history.replaceState(null, '', `track.html?ref=${encodeURIComponent(ref)}`);
    loadOrder(ref);
  });
}

async function fetchOrder(ref){
  if (!sb || !ref) return null;
  try {
    const { data, error } = await sb.rpc('get_order_status', { p_ref: ref });
    if (error || !data || !data.length) return null;
    return data[0];
  } catch (e) { return null; }
}

// Business info for the printable invoice — public settings table, same
// one staff.html edits under Paiement → Informations de l'entreprise.
let bizSettings = { biz_name: 'nyøkøn', biz_address: '', biz_phone: '', biz_email: '' };
async function loadBizSettings(){
  if (!sb) return;
  try {
    const { data } = await sb.from('settings').select('key,value').in('key', ['biz_name', 'biz_address', 'biz_phone', 'biz_email']);
    (data || []).forEach(r => { if (r.value) bizSettings[r.key] = r.value; });
  } catch (e) {}
}
loadBizSettings();

function printInvoice(order){
  document.getElementById('printBizName').textContent = bizSettings.biz_name || 'nyøkøn';
  document.getElementById('printBizMeta').textContent = [bizSettings.biz_address, bizSettings.biz_phone, bizSettings.biz_email].filter(Boolean).join(' · ');
  const statusLabel = order.status === 'cancelled' ? t('status_cancelled') : t('step_' + order.status);
  const placedDate = new Date(order.created_at).toLocaleDateString(currentLang === 'fr' ? 'fr-FR' : 'en-US', { day:'numeric', month:'long', year:'numeric' });
  const itemsRows = (order.items || []).map(i => {
    const variant = [i.color, i.size].filter(Boolean).join(', ');
    return `<tr><td>${i.name}${variant ? ' — ' + variant : ''}</td><td class="num">${i.qty}</td><td class="num">${money(i.price, order.currency)}</td><td class="num">${money(i.price * i.qty, order.currency)}</td></tr>`;
  }).join('');
  document.getElementById('printBody').innerHTML = `
    <div class="print-doc-title">${t('invoice_title')} ${order.ref}</div>
    <div class="print-doc-sub">${t('invoice_placed')} ${placedDate} — ${t('invoice_status')} : ${statusLabel}</div>
    <div class="print-kpi-row">
      ${order.customer_name ? `<div class="print-kpi"><div class="print-kpi-label">${t('invoice_customer')}</div><div class="print-kpi-value">${order.customer_name}</div></div>` : ''}
      ${order.customer_phone ? `<div class="print-kpi"><div class="print-kpi-label">${t('invoice_phone')}</div><div class="print-kpi-value">${order.customer_phone}</div></div>` : ''}
      <div class="print-kpi"><div class="print-kpi-label">${t('invoice_fulfillment')}</div><div class="print-kpi-value">${order.fulfillment === 'delivery' ? t('delivery') : t('pickup')}${order.city ? ' — ' + order.city : ''}</div></div>
    </div>
    ${order.address ? `<div class="print-doc-sub">${t('invoice_address')} : ${order.address}</div>` : ''}
    <table class="print-table">
      <tr><th>${t('invoice_item')}</th><th class="num">${t('invoice_qty')}</th><th class="num">${t('invoice_unit_price')}</th><th class="num">${t('invoice_total')}</th></tr>
      ${itemsRows}
      <tr class="print-total-row"><td colspan="3">${t('subtotal_label')}</td><td class="num">${money(order.subtotal, order.currency)}</td></tr>
    </table>
  `;
  document.getElementById('printFooter').textContent = `${t('invoice_footer')} ${new Date().toLocaleDateString(currentLang === 'fr' ? 'fr-FR' : 'en-US')} — ${t('invoice_thanks')}`;
  window.print();
}

function renderOrder(order){
  const root = document.getElementById('trackRoot');
  const cancelled = order.status === 'cancelled';
  const stepIdx = STEPS.indexOf(order.status);
  const placedDate = new Date(order.created_at).toLocaleDateString(currentLang === 'fr' ? 'fr-FR' : 'en-US', { day:'numeric', month:'short', year:'numeric' });

  root.innerHTML = `
    <div class="track-result">
      <div class="track-ref-row">
        <span class="track-ref">${t('order_ref')} ${order.ref}</span>
        <span class="track-date">${t('placed_on')} ${placedDate}</span>
      </div>
      ${cancelled ? `
        <p class="track-cancelled">${t('status_cancelled')}</p>
      ` : `
        <div class="track-steps">
          ${STEPS.map((s, i) => `
            <div class="track-step${i <= stepIdx ? ' is-done' : ''}${i === stepIdx ? ' is-current' : ''}">
              <span class="track-step-dot"></span>
              <span class="track-step-label">${t('step_' + s)}</span>
            </div>
          `).join('')}
        </div>
      `}
      <div class="track-details">
        <div class="track-detail-row">
          <span class="track-detail-label">${t('fulfillment_label')}</span>
          <span>${order.fulfillment === 'delivery' ? t('delivery') : t('pickup')}${order.city ? ' — ' + order.city : ''}</span>
        </div>
      </div>
      <div class="track-items">
        <div class="track-items-label">${t('items_label')}</div>
        ${(order.items || []).map(i => `
          <div class="track-item-row">
            <span>${i.name}${i.color || i.size ? ' — ' + [i.color, i.size].filter(Boolean).join(', ') : ''} × ${i.qty}</span>
            <span>${money(i.price * i.qty, order.currency)}</span>
          </div>
        `).join('')}
        <div class="track-item-row track-subtotal-row">
          <span>${t('subtotal_label')}</span>
          <span>${money(order.subtotal, order.currency)}</span>
        </div>
      </div>
      <p class="track-live-note">${t('live_note')}</p>
      ${cancelled ? '' : `<button type="button" class="track-another" id="printInvoiceBtn" style="margin-bottom:10px;">${t('print_invoice')}</button>`}
      <button type="button" class="track-another" id="trackAnotherBtn">${t('check_another')}</button>
    </div>
  `;
  document.getElementById('trackAnotherBtn').addEventListener('click', () => {
    history.replaceState(null, '', 'track.html');
    renderForm();
  });
  const printBtn = document.getElementById('printInvoiceBtn');
  if (printBtn) printBtn.addEventListener('click', () => printInvoice(order));
}

async function loadOrder(ref){
  const order = await fetchOrder(ref);
  if (!order) {
    renderForm(t('not_found'));
    return;
  }
  renderOrder(order);
  if (pollTimer) clearInterval(pollTimer);
  // Polling instead of a push subscription — status changes are staff-driven
  // and infrequent, so a periodic re-check is enough to feel "live" without
  // needing a public realtime-eligible policy on the orders table.
  pollTimer = setInterval(async () => {
    const fresh = await fetchOrder(ref);
    if (fresh && document.getElementById('trackRoot').querySelector('.track-result')) renderOrder(fresh);
  }, 20000);
}

(function init(){
  const params = new URLSearchParams(location.search);
  const ref = params.get('ref');
  if (ref) loadOrder(ref);
  else renderForm();
})();
</script>
</body>
</html>
